<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectHub Login</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:white;padding:30px;border-radius:16px;box-shadow:0 8px 30px #0001;width:320px;max-width:85%}h2{text-align:center;color:#2563eb}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#2563eb;color:white;border:0;border-radius:8px;cursor:pointer;font-size:16px}.error{color:#c00}a{color:#2563eb}
</style>
</head>
<body><div class="card"><h2>ConnectHub Login</h2>
{% if form.errors %}<p class="error">Username ya password galat hai. Dobara try karein.</p>{% endif %}
<form method="post">{% csrf_token %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<input type="hidden" name="next" value="/"/><button type="submit">Login</button></form>
<p>Account nahi hai? <a href="/accounts/signup/">Sign up</a></p>
</div></body></html>
